<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{% block title %}WAX Control Plane{% endblock %}</title>
  <style>
    /* Inline, same-origin styles only: the control plane never loads
       third-party assets (no CDN — no IP/DNT leak, no supply chain). */
    :root {
      --bg: #0f1115;
      --panel: #161a21;
      --panel-2: #1d222b;
      --border: #2a3140;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #d97706;      /* amber — operator attention */
      --ok: #10b981;          /* completed / success */
      --warn: #f59e0b;        /* pending / awaiting */
      --info: #14b8a6;        /* opened / neutral activity */
      --bad: #ef4444;         /* failed / expired */
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border);
      background: var(--panel); flex-wrap: wrap;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand strong { font-size: 17px; letter-spacing: .3px; }
    .brand span { color: var(--muted); font-size: 13px; }
    nav { display: flex; gap: 14px; align-items: center; }
    nav a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 6px; }
    nav a:hover { color: var(--text); background: var(--panel-2); }
    main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px 24px 48px; }
    footer {
      border-top: 1px solid var(--border); color: var(--muted);
      padding: 14px 24px; font-size: 12.5px; text-align: center; margin-top: auto;
    }
    .banner {
      border: 1px solid var(--border); border-left: 4px solid var(--warn);
      background: var(--panel); border-radius: 8px; padding: 12px 16px;
      margin: 0 0 20px; color: var(--muted); font-size: 13.5px;
    }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
    .card .k { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .6px; }
    .card .v { font-size: 26px; font-weight: 650; margin-top: 4px; }
    .card .v.small { font-size: 15px; font-weight: 500; font-family: var(--mono); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .5px; background: var(--panel-2); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    td.mono, .mono { font-family: var(--mono); font-size: 13px; }
    .muted { color: var(--muted); }
    .truncate { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    a.link { color: var(--accent); text-decoration: none; }
    a.link:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
    .badge.pending, .badge.awaiting_human, .badge.submitted, .badge.verifying { color: var(--warn); background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.35); }
    .badge.opened { color: var(--info); background: rgba(20,184,166,.08); border-color: rgba(20,184,166,.35); }
    .badge.completed { color: var(--ok); background: rgba(16,185,129,.08); border-color: rgba(16,185,129,.35); }
    .badge.rejected, .badge.failed, .badge.expired { color: var(--bad); background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.35); }
    .badge.cancelled { color: var(--muted); background: rgba(154,163,178,.08); border-color: rgba(154,163,178,.35); }
    .kind { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-family: var(--mono); border: 1px solid var(--border); color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px; max-width: 720px; }
    .panel + .panel { margin-top: 18px; }
    label { display: block; color: var(--muted); font-size: 13px; margin: 16px 0 6px; }
    input[type=password], input[type=text], select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); font-size: 14px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    button {
      margin-top: 18px; background: var(--accent); color: #161006; font-weight: 650;
      border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
    .error {
      border: 1px solid rgba(239,68,68,.4); background: rgba(239,68,68,.07);
      color: #fca5a5; border-radius: 8px; padding: 10px 14px; margin: 14px 0 0; font-size: 13.5px;
    }
    .ok-note {
      border: 1px solid rgba(16,185,129,.4); background: rgba(16,185,129,.07);
      color: #6ee7b7; border-radius: 8px; padding: 10px 14px; margin: 14px 0 0; font-size: 13.5px;
    }
    dl.meta { display: grid; grid-template-columns: 170px 1fr; gap: 8px 16px; margin: 0; }
    dl.meta dt { color: var(--muted); font-size: 13px; }
    dl.meta dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
    pre.instructions { white-space: pre-wrap; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; font-family: inherit; margin: 0; }
    ul.actions { margin: 0; padding-left: 18px; }
    .empty { color: var(--muted); padding: 26px 0; text-align: center; background: var(--panel); border: 1px dashed var(--border); border-radius: 10px; }
    @media (max-width: 640px) {
      header { padding: 12px 16px; } main { padding: 20px 16px 40px; }
      dl.meta { grid-template-columns: 1fr; }
      .truncate { max-width: 160px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <strong>WAX ▚ Control Plane</strong>
      <span>secure authority intake</span>
    </div>
    <nav>
      <a href="/control">Dashboard</a>
      <form method="post" action="/control/logout" style="display:inline">
        <button class="secondary" style="margin-top:0;padding:5px 12px;font-size:13px">Sign out</button>
      </form>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    WAX Runtime — infrastructure, not intelligence · server-rendered same-origin dashboard (ADR-0048) ·
    secrets are encrypted on submission and never displayed again
  </footer>
</body>
</html>
