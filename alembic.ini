# Alembic configuration for WAX.
#
# The database URL is read from the WAX_DATABASE_URL environment variable at
# runtime. This file is intentionally minimal — Alembic env.py does the real
# configuration work.

[alembic]
# The migrations live in this directory.
script_location = migrations

# Timezone for the timestamp column in the alembic_version table.
timezone = UTC

# The sqlalchemy.url is intentionally NOT set here. It is read from the
# WAX_DATABASE_URL environment variable in env.py so the same alembic.ini
# works for dev / staging / production.

# Output encoding for migrations.
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
