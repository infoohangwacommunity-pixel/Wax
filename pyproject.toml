[project]
name = "wax"
version = "0.1.0"
description = "WAX — AI-native environment/runtime. Infrastructure, not intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "WAX Founder Constitution" }]

dependencies = [
    # --- HTTP / API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asgiref>=3.8.0",
    # --- Validation / contracts ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- Server-rendered control plane (ADR-0048) ---
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",  # form parsing for the control-plane POST endpoints
    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",   # for tests / local dev
    # asyncpg is optional — install separately for PostgreSQL production:
    #   uv pip install asyncpg
    "asyncpg>=0.29.0",
    # --- HTTP client (LLM providers, external APIs) ---
    "httpx>=0.27.0",
    # --- Logging / observability ---
    "structlog>=24.4.0",
    # --- Configuration ---
    "python-dotenv>=1.0.1",
    # --- Utilities ---
    "anyio>=4.4.0",
    "tenacity>=9.0.0",          # bounded retries with backoff
    "python-ulid>=2.7.0",       # ULID identifiers (lexicographically sortable)
    "pyyaml>=6.0.2",
    "cryptography>=43.0.0",     # AES-GCM authenticated encryption for the vault
]

[project.optional-dependencies]
# Exact token counting for adapters that can use it (ADR-0018). OPTIONAL:
# adapters degrade to the documented estimator when this is absent, and
# the degradation is observable through the adapter's token_counter.
exact-tokens = ["tiktoken>=0.8.0"]
# Real document text extraction (PDF text layer). Self-gating: without
# it the document extractor reports document_extraction_not_configured.
media-docs = ["pypdf>=5.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # also for ASGI test client
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wax"]

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-q",
]
markers = [
    "unit: mechanism-level tests",
    "integration: subsystem interaction tests",
    "contract: boundary contract tests",
    "architecture: architectural invariant tests",
    "failure: failure-path tests",
    "security: adversarial tests",
    "e2e: end-to-end journey tests",
    "open_world: unanticipated-objective tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # assert False in tests is fine

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
packages = ["wax"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
